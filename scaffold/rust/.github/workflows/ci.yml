name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 钉完整 commit SHA，防 tag 移动带来的供应链风险（升级时改 SHA 并核对 release note）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11" # check_docs.py 需要
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable 分支（2026-11 快照）
      - name: 文档健康检查
        run: python scripts/check_docs.py
      - name: 格式检查
        run: cargo fmt --check
      - name: lint（clippy）
        run: cargo clippy -- -D warnings
      - name: 测试
        run: cargo test
